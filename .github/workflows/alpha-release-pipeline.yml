name: Alpha Release Pipeline

on:
  push:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  alpha-release:
    runs-on: ubuntu-latest
    if: github.event.pusher.name != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if release is needed
      id: check
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B | tr -d '\r')
        echo "Latest commit: $COMMIT_MSG"

        CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
        SIGNIFICANT_CHANGES=false

        while IFS= read -r file; do
          [ -z "$file" ] && continue
          if [[ ! "$file" =~ \.(md|txt)$ ]] &&
             [[ ! "$file" =~ ^docs/ ]] &&
             [[ ! "$file" =~ ^\.github/ ]] &&
             [[ "$file" != "VERSION" ]] &&
             [[ "$file" != ".gitignore" ]]; then
            SIGNIFICANT_CHANGES=true
            break
          fi
        done <<< "$CHANGED_FILES"

        if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$SIGNIFICANT_CHANGES" = true ]; then
          echo "needs_release=true" >> $GITHUB_OUTPUT
        else
          echo "needs_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Calculate alpha version
      if: steps.check.outputs.needs_release == 'true'
      id: version
      run: |
        # 从 VERSION 文件获取基础版本
        BASE_VERSION=$(cat VERSION | tr -d '[:space:]' | sed -E 's/-(alpha|beta|rc)\.[0-9]+$//')
        IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

        # 查找当前基础版本的最新 alpha tag
        LATEST_ALPHA=$(git tag -l "v${MAJOR}.${MINOR}.${PATCH}-alpha.*" | sort -V | tail -1 || echo "")

        if [ -n "$LATEST_ALPHA" ]; then
          ALPHA_NUM=$(echo "$LATEST_ALPHA" | sed -E 's/.*-alpha\.([0-9]+)$/\1/')
          NEW_ALPHA_NUM=$((ALPHA_NUM + 1))
        else
          NEW_ALPHA_NUM=1
        fi

        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-alpha.${NEW_ALPHA_NUM}"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New alpha version: $NEW_VERSION"

    - name: Update VERSION and commit
      if: steps.check.outputs.needs_release == 'true'
      run: |
        echo "${{ steps.version.outputs.version }}" > VERSION
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add VERSION
        git commit -m "chore: bump alpha version to ${{ steps.version.outputs.tag }} [skip ci]"

    - name: Setup Node.js
      if: steps.check.outputs.needs_release == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: web/admin-spa/package-lock.json

    - name: Build Frontend
      if: steps.check.outputs.needs_release == 'true'
      run: |
        cd web/admin-spa
        npm ci
        npm run build

    - name: Create and push tag
      if: steps.check.outputs.needs_release == 'true'
      run: |
        git tag -a "${{ steps.version.outputs.tag }}" -m "Alpha release ${{ steps.version.outputs.tag }}"
        git push origin HEAD:alpha "${{ steps.version.outputs.tag }}"

    - name: Install git-cliff
      if: steps.check.outputs.needs_release == 'true'
      run: |
        wget -q https://github.com/orhun/git-cliff/releases/download/v1.4.0/git-cliff-1.4.0-x86_64-unknown-linux-gnu.tar.gz
        tar -xzf git-cliff-1.4.0-x86_64-unknown-linux-gnu.tar.gz
        sudo mv git-cliff-1.4.0/git-cliff /usr/local/bin/

    - name: Generate changelog
      if: steps.check.outputs.needs_release == 'true'
      id: changelog
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LATEST_TAG" ]; then
          CHANGELOG=$(git-cliff --config .github/cliff.toml $LATEST_TAG..HEAD --strip header 2>/dev/null || echo "- Alpha 版本更新")
        else
          CHANGELOG="- Alpha 版本更新"
        fi
        echo "content<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Prepare image names
      if: steps.check.outputs.needs_release == 'true'
      id: images
      run: |
        DOCKER_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
        [ -z "$DOCKER_USERNAME" ] && DOCKER_USERNAME="weishaw"
        echo "docker=$(echo ${DOCKER_USERNAME}/claude-relay-service | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        echo "ghcr=$(echo ghcr.io/${{ github.repository_owner }}/claude-relay-service | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: steps.check.outputs.needs_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }} (Alpha)
        body: |
          ## Alpha 预发布版本

          > 此为测试版本，仅供测试使用，不建议用于生产环境

          ### Docker 镜像

          ```bash
          docker pull ${{ steps.images.outputs.docker }}:${{ steps.version.outputs.tag }}
          docker pull ${{ steps.images.outputs.ghcr }}:${{ steps.version.outputs.tag }}
          ```

          ### 更新内容

          ${{ steps.changelog.outputs.content }}
        draft: false
        prerelease: true

    - name: Set up QEMU
      if: steps.check.outputs.needs_release == 'true'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      if: steps.check.outputs.needs_release == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: steps.check.outputs.needs_release == 'true'
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GHCR
      if: steps.check.outputs.needs_release == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      if: steps.check.outputs.needs_release == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ steps.images.outputs.docker }}:${{ steps.version.outputs.tag }}
          ${{ steps.images.outputs.docker }}:${{ steps.version.outputs.version }}
          ${{ steps.images.outputs.docker }}:alpha
          ${{ steps.images.outputs.ghcr }}:${{ steps.version.outputs.tag }}
          ${{ steps.images.outputs.ghcr }}:${{ steps.version.outputs.version }}
          ${{ steps.images.outputs.ghcr }}:alpha
        labels: |
          org.opencontainers.image.version=${{ steps.version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
